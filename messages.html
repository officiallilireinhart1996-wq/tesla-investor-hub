<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Tesla Capital Portal - Messages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0d0d0d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100dvh;
            overflow: hidden;
        }
        #chatContainer {
            scroll-behavior: smooth;
        }
        .bubble-user {
            background: #E82127;
            border-radius: 18px 18px 4px 18px;
        }
        .bubble-support {
            background: #1f1f1f;
            border-radius: 18px 18px 18px 4px;
        }
        /* Hide scrollbar but keep functionality */
        #chatContainer::-webkit-scrollbar { width: 4px; }
        #chatContainer::-webkit-scrollbar-track { background: transparent; }
        #chatContainer::-webkit-scrollbar-thumb { background: #333; border-radius: 99px; }
    </style>
</head>
<body class="text-white flex flex-col h-screen">

    <!-- Header -->
    <header class="flex items-center justify-between px-4 py-3 border-b border-[#1c1c1c] bg-[#0d0d0d] shrink-0 z-20">
        <a href="dashboard.html" class="text-neutral-400 hover:text-white flex items-center text-sm">
            ‹ Back
        </a>
        <div class="text-center">
            <p class="text-sm font-semibold">Tesla Support</p>
            <p class="text-[10px] text-emerald-400 flex items-center justify-center gap-1">
                <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full"></span> Online
            </p>
        </div>
        <div class="w-10"></div>
    </header>

    <!-- Chat Area -->
    <div id="chatContainer" class="flex-1 overflow-y-auto px-3 py-4 space-y-3 bg-[#0a0a0a]">
        <div class="text-center py-20 text-neutral-500 text-sm">
            Loading conversation...
        </div>
    </div>

    <!-- Fixed Input Bar (always visible) -->
    <div class="shrink-0 border-t border-[#1c1c1c] bg-[#0d0d0d] px-3 py-3 safe-area-bottom">
        <div class="flex items-end gap-2 max-w-3xl mx-auto">
            <div class="flex-1 bg-[#1c1c1c] border border-[#333] rounded-3xl px-4 py-2.5 flex items-center">
                <input type="text" id="messageInput" 
                       placeholder="Type a message..." 
                       autocomplete="off"
                       class="w-full bg-transparent text-white text-sm focus:outline-none placeholder-neutral-500">
            </div>
            <button id="sendBtn" onclick="sendMessage()" 
                    class="w-11 h-11 bg-[#E82127] hover:bg-red-600 active:scale-95 rounded-full flex items-center justify-center transition-all shrink-0">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // ========== SUPABASE ==========
        const SUPABASE_URL = "https://jawpzkqvcvcrmpirqcma.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_EAds5LMLdll_0ubbbhw_kg_fJxzlOtH";
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        // =============================

        const userId = localStorage.getItem("userId");
        if (!userId) window.location.href = "index.html";

        const chatContainer = document.getElementById('chatContainer');
        const messageInput  = document.getElementById('messageInput');
        const sendBtn       = document.getElementById('sendBtn');

        let isLoading = false;
        let lastMessageCount = 0;

        // Format time like WhatsApp
        function formatTime(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        }

        // Render messages without destroying the whole container (smooth)
        function renderMessages(messages) {
            if (!messages || messages.length === 0) {
                chatContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-neutral-500 py-20">
                        <div class="w-16 h-16 bg-[#1a1a1a] rounded-full flex items-center justify-center mb-4">
                            <svg class="w-8 h-8 text-neutral-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                            </svg>
                        </div>
                        <p class="font-medium">Tesla Capital Support</p>
                        <p class="text-xs mt-1">Send a message to start the conversation</p>
                    </div>`;
                return;
            }

            // Only re-render if message count changed (prevents flicker)
            if (messages.length === lastMessageCount && chatContainer.children.length > 0) {
                return;
            }
            lastMessageCount = messages.length;

            const wasAtBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight < 80;

            let html = '';
            messages.forEach(msg => {
                const isUser = msg.sender === 'User';
                const time = formatTime(msg.created_at);

                html += `
                <div class="flex ${isUser ? 'justify-end' : 'justify-start'}">
                    <div class="max-w-[78%] ${isUser ? 'bubble-user' : 'bubble-support'} px-3.5 py-2.5 shadow-sm">
                        <p class="text-sm leading-relaxed break-words">${escapeHtml(msg.message)}</p>
                        <p class="text-[10px] mt-1 ${isUser ? 'text-red-100/70' : 'text-neutral-500'} text-right">${time}</p>
                    </div>
                </div>`;
            });

            chatContainer.innerHTML = html;

            if (wasAtBottom || lastMessageCount <= 2) {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadMessages(silent = false) {
            if (isLoading) return;
            isLoading = true;

            try {
                const { data, error } = await _supabase
                    .from('messages')
                    .select('id, message, sender, status, parent_id, created_at')
                    .eq('user_id', userId)
                    .order('created_at', { ascending: true });

                if (error) throw error;
                renderMessages(data || []);
            } catch (err) {
                console.error(err);
                if (!silent) {
                    chatContainer.innerHTML = `<div class="text-center py-16 text-red-400 text-sm">Could not load messages</div>`;
                }
            }

            isLoading = false;
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // Optimistic UI - show message immediately
            const tempId = 'temp-' + Date.now();
            const optimistic = {
                id: tempId,
                message: text,
                sender: 'User',
                created_at: new Date().toISOString()
            };

            // Get current messages from DOM or reload
            messageInput.value = '';
            sendBtn.disabled = true;

            try {
                const msgId = "MSG-" + Math.floor(100000 + Math.random() * 900000);

                const { error } = await _supabase
                    .from('messages')
                    .insert({
                        id: msgId,
                        user_id: userId,
                        message: text,
                        sender: 'User',
                        status: 'Unread'
                    });

                if (error) throw error;

                // Reload to get the real message + any replies
                await loadMessages(true);
                chatContainer.scrollTop = chatContainer.scrollHeight;

            } catch (err) {
                console.error(err);
                alert("Failed to send message. Please try again.");
            }

            sendBtn.disabled = false;
            messageInput.focus();
        }

        // Enter to send
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Initial load
        loadMessages();

        // Poll every 6 seconds for new replies (smooth, no full reload feel)
        setInterval(() => loadMessages(true), 6000);

        // Keep input focused on mobile after send
        messageInput.focus();
    </script>
</body>
</html>
